name: qwen3-tts

# Three qwen-tts-demo containers, one per model. The demo binary picks its
# UI (preset speakers vs reference-audio clone vs text-described voice
# design) from the model class it loads, so "swap modes" = "swap the
# container behind a different hostname". All three share one image build
# and one HF cache volume — different models land in different repo
# subdirs so concurrent downloads don't collide.
#
# GPU footprint is small (each 1.7B checkpoint is ~4 GB bf16 + a few GB of
# KV/activations); an RTX PRO 6000 has plenty of room to keep all three
# hot. Cold-swapping would save maybe 8 GB of VRAM but reintroduces the
# reload penalty this design is meant to avoid.
#
# Hostname config lives in `.env` (gitignored) — copy `.env-dist` and fill
# in your Traefik-routable hostnames. Compose auto-loads `.env` from THIS
# directory when you run `docker compose` from here; from elsewhere use
# `docker compose --env-file qwen3-tts/.env -f qwen3-tts/docker-compose.yml`.

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
    args:
      BUILD_FLASH_ATTN: "1"
  image: qwen-tts:latest
  restart: unless-stopped
  # NixOS host uses CDI for GPU passthrough (no legacy nvidia runtime).
  devices:
    - nvidia.com/gpu=all
  # One HF cache across all three services: each model's weights live at
  # `/models/<repo>/…` — no filename collisions, and any shared submodule
  # is fetched once.
  volumes:
    - qwen3-tts-models:/models
  shm_size: "8gb"

x-common-env: &common-env
  HF_HOME: /models
  HUGGINGFACE_HUB_CACHE: /models
  HF_HUB_ENABLE_HF_TRANSFER: "1"
  # Every container binds 8000 inside its own network namespace; Traefik
  # differentiates by Host() header, so no per-service port juggling.
  QWEN_TTS_PORT: "8000"
  QWEN_TTS_DTYPE: bfloat16
  QWEN_TTS_FLASH_ATTN: "1"
  QWEN_TTS_CONCURRENCY: "4"

services:
  # Preset speakers (Serena / Vivian / Ryan / …) + free-text `instruct`
  # style control. Original hostname preserved so existing rpg_vox voice
  # profiles keep resolving without any app-side change until the multi-
  # backend work in rpg_vox lands.
  presets:
    <<: *common
    environment:
      <<: *common-env
      QWEN_TTS_MODEL: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
    labels:
      traefik.enable: "true"
      traefik.http.routers.qwen3-tts-presets.entrypoints: websecure
      traefik.http.routers.qwen3-tts-presets.rule: Host(`${QWEN3_TTS_PRESETS_HOST:?set QWEN3_TTS_PRESETS_HOST in qwen3-tts/.env}`)
      traefik.http.routers.qwen3-tts-presets.middlewares: qwen3-tts-presets-ipallowlist
      traefik.http.middlewares.qwen3-tts-presets-ipallowlist.ipallowlist.sourcerange: 0.0.0.0/0
      traefik.http.services.qwen3-tts-presets.loadbalancer.server.port: "8000"

  # 3-second reference-audio voice clone (Base model). Browser mic capture
  # requires HTTPS on the client side — Traefik handles that already.
  clone:
    <<: *common
    environment:
      <<: *common-env
      QWEN_TTS_MODEL: Qwen/Qwen3-TTS-12Hz-1.7B-Base
    labels:
      traefik.enable: "true"
      traefik.http.routers.qwen3-tts-clone.entrypoints: websecure
      traefik.http.routers.qwen3-tts-clone.rule: Host(`${QWEN3_TTS_CLONE_HOST:?set QWEN3_TTS_CLONE_HOST in qwen3-tts/.env}`)
      traefik.http.routers.qwen3-tts-clone.middlewares: qwen3-tts-clone-ipallowlist
      traefik.http.middlewares.qwen3-tts-clone-ipallowlist.ipallowlist.sourcerange: 0.0.0.0/0
      traefik.http.services.qwen3-tts-clone.loadbalancer.server.port: "8000"

  # Voice generated from a free-text description ("gravelly old sailor,
  # slight lisp, warm mid-range"). No reference audio needed — the
  # description is what shapes timbre.
  design:
    <<: *common
    environment:
      <<: *common-env
      QWEN_TTS_MODEL: Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign
    labels:
      traefik.enable: "true"
      traefik.http.routers.qwen3-tts-design.entrypoints: websecure
      traefik.http.routers.qwen3-tts-design.rule: Host(`${QWEN3_TTS_DESIGN_HOST:?set QWEN3_TTS_DESIGN_HOST in qwen3-tts/.env}`)
      traefik.http.routers.qwen3-tts-design.middlewares: qwen3-tts-design-ipallowlist
      traefik.http.middlewares.qwen3-tts-design-ipallowlist.ipallowlist.sourcerange: 0.0.0.0/0
      traefik.http.services.qwen3-tts-design.loadbalancer.server.port: "8000"

volumes:
  qwen3-tts-models:
    name: qwen3-tts-models
