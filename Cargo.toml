[package]
name = "rpg_vox"
version = "0.1.0"
edition = "2021"
description = "Voice bridge over pipewire"
license = "MIT"

[dependencies]
# PipeWire native client (source node in-process)
pipewire = "0.8"
libspa = "0.8"

# Async runtime + HTTP server + WebSocket client
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net", "time", "io-util"] }
axum = "0.7"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"

# Audio decode + resample
symphonia = { version = "0.5", features = ["wav", "mp3", "flac", "ogg", "vorbis"] }
rubato = "0.15"

# Realtime-safe SPSC ring buffer for audio samples
rtrb = "0.3"

# Utilities
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
opt-level = 3
