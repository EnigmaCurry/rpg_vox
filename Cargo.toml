[workspace]
resolver = "2"
members = [
    "crates/rpg_vox",
    "crates/discord_vox",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Runtime + utilities shared across crates.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net", "time", "io-util"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# PipeWire native client. Both crates register nodes in-process.
pipewire = "0.8"
libspa = "0.8"

# Realtime-safe SPSC ring buffer for audio samples.
rtrb = "0.3"

[profile.release]
lto = "thin"
opt-level = 3
