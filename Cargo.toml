[workspace]
resolver = "2"
members = [
    "crates/rpg_vox",
    "crates/discord_vox",
    "crates/vox_transcribe",
    "crates/vox_audio",
    "crates/vox_scribe",
    "crates/vox_chat",
    "crates/vox_agent",
    "crates/vox_android",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Runtime + utilities shared across crates.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net", "time", "io-util"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# PipeWire native client. Both crates register nodes in-process. The
# `v0_3_49` feature enables `Buffer::requested()`, which lets the source
# stream fill exactly the frame count PipeWire is asking for this cycle
# instead of the whole `max_size` allocation — matches the driver's
# quantum and avoids buffer/quantum misalignment when the source is
# linked to a live hardware sink (e.g. local monitor speakers).
pipewire = { version = "0.8", features = ["v0_3_49"] }
libspa = "0.8"

# Realtime-safe SPSC ring buffer for audio samples.
rtrb = "0.3"

[profile.release]
lto = "thin"
opt-level = 3
