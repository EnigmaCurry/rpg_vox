# XcodeGen spec for the iOS dictation app; `just ios-app` generates
# Scribe.xcodeproj from it (not committed) after building crates/vox_ios.
name: Scribe
options:
  bundleIdPrefix: com.enigmacurry
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # Overridden on the command line by `just ios-app` (SCRIBE_TEAM,
    # SCRIBE_BUNDLE_ID); a free Apple ID's Personal Team works.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.enigmacurry.rpg-vox-scribe
    MARKETING_VERSION: "0.1.7"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Scribe:
    type: application
    platform: iOS
    sources:
      - Scribe
    dependencies:
      # Copied here from sherpa-onnx-sys's download by `just ios-app`.
      - framework: Frameworks/SherpaOnnxC.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Scribe/Scribe-Bridging-Header.h
        # libvox_ios.a, built by cargo into target/ios.
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(SRCROOT)/../target/ios/aarch64-apple-ios/release
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: $(SRCROOT)/../target/ios/aarch64-apple-ios-sim/release
        OTHER_LDFLAGS: ["-lvox_ios", "-lc++"]
        ARCHS: arm64
        ENABLE_BITCODE: NO
    info:
      path: Scribe/Info.plist
      properties:
        CFBundleDisplayName: Scribe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: Scribe transcribes what the microphone hears, on this device.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Keep recording with the screen off or another app in front.
        UIBackgroundModes: [audio]
        # Models go in Documents/models: Finder's file sharing, the Files
        # app, or `just ios-models`.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
