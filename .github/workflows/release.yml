# Build release archives on a version tag and attach them to a GitHub
# Release. Each target builds natively; `just dist` does the build and
# packaging, so a local `just dist` produces the same archives.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Running it by hand (Actions > release > Run workflow) on any branch
# builds everything as workflow artifacts without publishing a release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      # Link libopus statically so the binaries don't need it installed.
      LIBOPUS_STATIC: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      # PipeWire headers for pipewire-sys (bindgen needs libclang), and
      # libopus for rpg_vox's browser monitor. sherpa-onnx downloads its
      # own static archive at build time.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev cmake \
            libpipewire-0.3-dev libspa-0.2-dev libopus-dev

      # rpg_vox's build.rs builds the Svelte UI with pnpm.
      - uses: pnpm/action-setup@v4
        if: runner.os == 'Linux'
        with:
          version: 11
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: extractions/setup-just@v2

      - name: Build and package
        run: just dist "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The Scribe dictation app (android/). arm64-v8a only: it covers every
  # current phone, and the 32-bit-only phones a second ABI would add are
  # too slow for the speech models anyway.
  android:
    name: build (android-arm64 apk)
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner's Android SDK has an NDK, but pin the one the app is
      # developed against.
      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk,just
      - uses: gradle/actions/setup-gradle@v4

      # Release signing key, if the repo has one (base64 keystore plus
      # passwords in secrets); otherwise `just android-apk` signs with a
      # throwaway debug key and each release must be installed fresh.
      - name: Release keystore
        env:
          KEYSTORE_B64: ${{ secrets.SCRIBE_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/scribe.jks"
          echo "SCRIBE_KEYSTORE=$RUNNER_TEMP/scribe.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          SCRIBE_KEYSTORE_PASSWORD: ${{ secrets.SCRIBE_KEYSTORE_PASSWORD }}
          SCRIBE_KEY_ALIAS: ${{ secrets.SCRIBE_KEY_ALIAS }}
          SCRIBE_KEY_PASSWORD: ${{ secrets.SCRIBE_KEY_PASSWORD }}
        run: just android-apk "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android-arm64
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
