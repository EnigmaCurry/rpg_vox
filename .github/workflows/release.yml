# Build release archives on a version tag and attach them to a GitHub
# Release. Each target builds natively; `just dist` does the build and
# packaging, so a local `just dist` produces the same archives.
#
#   git tag v0.1.0 && git push origin v0.1.0
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      # Link libopus statically so the binaries don't need it installed.
      LIBOPUS_STATIC: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      # PipeWire headers for pipewire-sys (bindgen needs libclang), and
      # libopus for rpg_vox's browser monitor. sherpa-onnx downloads its
      # own static archive at build time.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev cmake \
            libpipewire-0.3-dev libspa-0.2-dev libopus-dev

      # rpg_vox's build.rs builds the Svelte UI with pnpm.
      - uses: pnpm/action-setup@v4
        if: runner.os == 'Linux'
        with:
          version: 11
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: extractions/setup-just@v2

      - name: Build and package
        run: just dist "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
