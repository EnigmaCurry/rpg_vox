[package]
name = "rpg_vox"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Voice bridge over pipewire"
build = "build.rs"

[dependencies]
# Embed the Svelte SPA (built by build.rs into crates/rpg_vox/dist-ui/).
rust-embed = { version = "8", features = ["mime-guess"] }


pipewire.workspace = true
libspa.workspace = true

tokio.workspace = true
# `ws` enables axum's WebSocket extractor used by the browser monitor
# (Opus-over-WebSocket audio tap).
axum = { version = "0.7", features = ["ws"] }
# libopus wrapper for the browser-monitor Opus encoder. The C library is
# provided by nixpkgs `libopus` (already in shell.nix buildInputs).
opus = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
futures-util = "0.3"

symphonia = { version = "0.5", features = ["wav", "mp3", "flac", "ogg", "vorbis"] }
rubato = "0.15"

# Pure-Rust FLAC encoder for the scene download endpoint. Chosen over
# libFLAC bindings to keep the NixOS build free of an extra C dep.
flacenc = "0.5"

# Zip encoder for the "download recording archive" endpoint. `default-
# features = false` skips optional compression backends (deflate, bzip2,
# zstd) since we bundle already-compressed WAVs and a tiny JSON — stored
# entries are fine and keep the dep footprint small.
zip = { version = "2", default-features = false }

# Timestamp formatting for the scene download filename. UTC only — the
# server doesn't take a locale.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Pure-Rust pitch-shift + time-stretch for per-style voice effects. Applied
# to the mono f32 buffer after the TTS backend synthesizes and before the
# audio hits the ringbuf / WAV encoder. Only DSP dep is rustfft.
timestretch = "0.15"

rtrb.workspace = true

serde.workspace = true
serde_json.workspace = true
clap = { workspace = true, features = ["env"] }
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { version = "1", features = ["v4"] }

# Persistent store for the Speak-widget clips. `bundled` avoids a system
# sqlite dep on NixOS. Pinned to 0.31 to share `libsqlite3-sys` with the
# discord_vox crate (cargo forbids two versions of the same links="sqlite3"
# native lib in one build graph).
rusqlite = { version = "0.31", features = ["bundled"] }

# Speech-to-text via k2-fsa/sherpa-onnx, linked statically (its prebuilt
# archive bundles onnxruntime), so the binary needs no .so files beside
# it. Every crate in the workspace must agree: sherpa-onnx-sys refuses
# to build with both `static` and `shared` enabled.
sherpa-onnx = { version = "1.13.7", default-features = false, features = ["static"] }

# Shared transcription helpers (pass-3 split, false-positive filter,
# sherpa stderr filter). Recognizers stay in stt.rs for now, so the
# crate's own sherpa feature is off.
vox_transcribe = { path = "../vox_transcribe", default-features = false }
