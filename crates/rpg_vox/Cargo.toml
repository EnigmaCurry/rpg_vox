[package]
name = "rpg_vox"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Voice bridge over pipewire"
build = "build.rs"

[dependencies]
# Embed the Svelte SPA (built by build.rs into crates/rpg_vox/dist-ui/).
rust-embed = { version = "8", features = ["mime-guess"] }


pipewire.workspace = true
libspa.workspace = true

tokio.workspace = true
# `ws` enables axum's WebSocket extractor used by the browser monitor
# (Opus-over-WebSocket audio tap).
axum = { version = "0.7", features = ["ws"] }
# libopus wrapper for the browser-monitor Opus encoder. The C library is
# provided by nixpkgs `libopus` (already in shell.nix buildInputs).
opus = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
futures-util = "0.3"

symphonia = { version = "0.5", features = ["wav", "mp3", "flac", "ogg", "vorbis"] }
rubato = "0.15"

# Pure-Rust FLAC encoder for the scene download endpoint. Chosen over
# libFLAC bindings to keep the NixOS build free of an extra C dep.
flacenc = "0.5"

# Timestamp formatting for the scene download filename. UTC only — the
# server doesn't take a locale.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Piper TTS backend. Runs the ONNX voice model in-process via `ort`; espeak-rs
# vendors espeak-ng (build needs cmake). `ort`'s `load-dynamic` feature makes
# it dlopen libonnxruntime at runtime — friendlier on NixOS than the default
# prebuilt-binary download. The shell.nix provides ORT_DYLIB_PATH.
piper-rs = "0.2"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic", "ndarray"] }

# Pure-Rust pitch-shift + time-stretch for per-style voice effects. Applied
# to the mono f32 buffer after the TTS backend synthesizes and before the
# audio hits the ringbuf / WAV encoder. Only DSP dep is rustfft.
timestretch = "0.15"

rtrb.workspace = true

serde.workspace = true
serde_json.workspace = true
clap = { workspace = true, features = ["env"] }
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { version = "1", features = ["v4"] }

# Persistent store for the Speak-widget clips. `bundled` avoids a system
# sqlite dep on NixOS. Pinned to 0.31 to share `libsqlite3-sys` with the
# discord_vox crate (cargo forbids two versions of the same links="sqlite3"
# native lib in one build graph).
rusqlite = { version = "0.31", features = ["bundled"] }

# Speech-to-text via k2-fsa/sherpa-onnx. We deliberately opt out of the
# default `static` feature because that would statically link espeak-ng
# — a symbol conflict with `piper-rs`'s `espeak-rs-sys`, which also
# statically links its own copy of the same C library. `shared` makes
# the build.rs download prebuilt .so files and encode an rpath into the
# binary, so sherpa-onnx keeps its private espeak inside its .so and our
# binary only sees the C-API surface. Onnxruntime symbol overlap with
# the `ort` crate above is separately avoided by `ort`'s `load-dynamic`
# feature (dlopens libonnxruntime at runtime from ORT_DYLIB_PATH).
sherpa-onnx = { version = "1.13.7", default-features = false, features = ["shared"] }
