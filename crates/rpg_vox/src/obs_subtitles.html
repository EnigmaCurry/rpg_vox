<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>rpg_vox subtitles</title>
<style>
  :root { color-scheme: dark; }
  /* !important resists OBS's Browser Source injected CSS
     (`body { margin: 0px auto }`), plus a font-family override in
     some builds. */
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    background: transparent;
    color: #ffffff;
    font-family: sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  /* position: fixed anchors both views to the viewport regardless of
     whether OBS/CEF has laid out body with unexpected margins or auto
     centering. `inset: 0` = fill viewport.
     Layout: text is right-aligned and packed toward the top so a new
     clip starts in the upper-right corner and subsequent clips flow
     downward. When the accumulated height would spill past the bottom,
     the JS clears the page and restarts at the top with the newest
     clip — see the render()/fits() pair. */
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: stretch;
    padding: 3vh 3vw;
    gap: 1.6vh;
    box-sizing: border-box;
    overflow: hidden;
    text-align: right;
    font-size: clamp(28px, 4.5vh, 72px);
    line-height: 1.15;
  }
  .line {
    text-shadow:
      0 0 12px rgba(0, 0, 0, 0.85),
      0 3px 6px rgba(0, 0, 0, 0.9);
    overflow-wrap: anywhere;
  }
  /* Provisional entries are streaming-STT partials — italic + slightly
     dimmed so viewers can tell the text may still be revised. Any entry
     without an offline-corrected `finalText` renders as provisional;
     as soon as the corrected pass lands (on any entry, latest or not)
     the italic drops and the corrected text takes over. */
  .line.provisional .text { font-style: italic; opacity: 0.9; }
  .who {
    display: block;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #ffd166;
    text-transform: uppercase;
    font-size: 0.5em;
    margin-bottom: 0.1em;
  }
  .text {
    display: block;
    font-weight: 600;
  }
  #suspended {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4vh 6vw;
    box-sizing: border-box;
    text-align: center;
    font-size: clamp(24px, 5vh, 96px);
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.55);
    text-shadow:
      0 0 12px rgba(0, 0, 0, 0.85),
      0 3px 6px rgba(0, 0, 0, 0.9);
    line-height: 1.1;
  }
  #suspended .label {
    display: inline-flex;
    align-items: center;
    gap: 0.4em;
    white-space: nowrap;
  }
  #suspended .dot {
    display: inline-block;
    width: 0.7em;
    height: 0.7em;
    border-radius: 50%;
    background: rgba(255, 90, 90, 0.85);
    box-shadow: 0 0 12px rgba(255, 90, 90, 0.55);
    flex-shrink: 0;
  }
  body.recording #suspended { display: none; }
  body:not(.recording) #stage { display: none; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="suspended"><span class="label"><span class="dot"></span><span class="text">Recording suspended</span></span></div>
<script>
(() => {
  const stage = document.getElementById("stage");
  // Clear the visible page after this long with no new events. Keeps
  // stale text off-screen without wiping mid-conversation pauses.
  const IDLE_CLEAR_MS = 30000;
  // Stage 1 overlay: show the last N paragraphs in order of arrival.
  // A future pass will restore multi-line ordering, provisional
  // styling, etc. — for now we just render paragraph text keyed by
  // paragraph id.
  const MAX_PARAGRAPHS = 2;

  /**
   * paragraphs — Map<id, {id, who, text, hardened, startWallMs}>,
   * insertion-ordered by arrival. `render()` truncates to the last
   * MAX_PARAGRAPHS entries.
   */
  const paragraphs = new Map();
  let idleTimer = null;

  function scheduleIdleClear() {
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      paragraphs.clear();
      render();
      idleTimer = null;
    }, IDLE_CLEAR_MS);
  }

  function makeLine(paragraph) {
    const line = document.createElement("div");
    // In Stage 1 paragraphs are only "provisional" in the sense that
    // any of their clips are still streaming partials. Render any
    // paragraph whose text is non-empty; italicize if !hardened and
    // some clip is provisional.
    const anyProvisional =
      Array.isArray(paragraph.clips) && paragraph.clips.some((c) => c && c.provisional);
    const showAsProvisional = !paragraph.hardened && anyProvisional;
    line.className = "line" + (showAsProvisional ? " provisional" : "");
    const who = document.createElement("span");
    who.className = "who";
    who.textContent = paragraph.who || "";
    const text = document.createElement("span");
    text.className = "text";
    text.textContent = paragraph.text || "";
    line.append(who, text);
    return line;
  }

  function render() {
    stage.replaceChildren();
    const ordered = Array.from(paragraphs.values());
    const shown = ordered.slice(Math.max(0, ordered.length - MAX_PARAGRAPHS));
    for (const p of shown) {
      if (!p.text) continue;
      stage.append(makeLine(p));
    }
    // Overflow trim: drop from the front until it fits or we're down
    // to a single paragraph. Cheap because MAX_PARAGRAPHS is tiny.
    while (stage.children.length > 1 && !fits()) {
      stage.firstElementChild.remove();
    }
  }

  /** True when the accumulated content fits inside the stage's box. */
  function fits() {
    return stage.scrollHeight <= stage.clientHeight + 1;
  }

  function paragraphUpsert(evt) {
    if (!evt || !evt.id) return;
    const existing = paragraphs.get(evt.id) || {};
    // Preserve insertion order: setting an existing key doesn't move
    // it in a Map, which is exactly what we want.
    paragraphs.set(evt.id, {
      id: evt.id,
      who: (evt.who || existing.who || "").trim() || "unknown",
      text: (evt.text ?? existing.text ?? "").trim(),
      hardened: !!evt.hardened,
      clips: Array.isArray(evt.clips) ? evt.clips : existing.clips || [],
      startWallMs: Number(evt.start_wall_ms) || existing.startWallMs || 0,
    });
    render();
    scheduleIdleClear();
  }

  function paragraphRemove(id) {
    if (!id) return;
    if (paragraphs.delete(id)) render();
  }

  function clipUpsert(evt) {
    if (!evt || !evt.paragraph_id || !evt.clip) return;
    const p = paragraphs.get(evt.paragraph_id);
    if (!p) return;
    // Merge the clip into the paragraph's clips array by id so a
    // paragraphUpsert doesn't need to fire on every partial update.
    const clips = Array.isArray(p.clips) ? p.clips.slice() : [];
    const idx = clips.findIndex((c) => c && c.id === evt.clip.id);
    if (idx >= 0) clips[idx] = evt.clip;
    else clips.push(evt.clip);
    // Rebuild paragraph text as a naïve space-join, matching the
    // Stage 1 backend behavior.
    const text = clips
      .map((c) => (c && c.text) ? c.text : "")
      .filter((t) => t !== "")
      .join(" ");
    paragraphs.set(evt.paragraph_id, { ...p, clips, text });
    render();
    scheduleIdleClear();
  }

  function clipRemove(evt) {
    if (!evt || !evt.paragraph_id || !evt.clip_id) return;
    const p = paragraphs.get(evt.paragraph_id);
    if (!p || !Array.isArray(p.clips)) return;
    const clips = p.clips.filter((c) => c && c.id !== evt.clip_id);
    if (clips.length === p.clips.length) return;
    const text = clips
      .map((c) => (c && c.text) ? c.text : "")
      .filter((t) => t !== "")
      .join(" ");
    paragraphs.set(evt.paragraph_id, { ...p, clips, text });
    render();
  }

  function setRecording(active) {
    const was = document.body.classList.contains("recording");
    document.body.classList.toggle("recording", !!active);
    if (!active) {
      paragraphs.clear();
      if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
    }
    if (was !== !!active) scheduleRefit();
    else refit();
  }

  function connect() {
    const src = new EventSource("/obs/subtitles.sse");
    src.addEventListener("status", (ev) => {
      let data;
      try { data = JSON.parse(ev.data); } catch { return; }
      setRecording(!!(data && data.recording));
    });
    src.addEventListener("paragraphUpsert", (ev) => {
      let data;
      try { data = JSON.parse(ev.data); } catch { return; }
      if (!data) return;
      if (!document.body.classList.contains("recording")) {
        setRecording(true);
      }
      paragraphUpsert(data);
    });
    src.addEventListener("paragraphRemove", (ev) => {
      let data;
      try { data = JSON.parse(ev.data); } catch { return; }
      if (!data || !data.id) return;
      paragraphRemove(data.id);
    });
    src.addEventListener("clipUpsert", (ev) => {
      let data;
      try { data = JSON.parse(ev.data); } catch { return; }
      clipUpsert(data);
    });
    src.addEventListener("clipRemove", (ev) => {
      let data;
      try { data = JSON.parse(ev.data); } catch { return; }
      clipRemove(data);
    });
    src.onerror = () => {
      // Browser reconnects EventSource on its own; on reconnect the
      // server re-sends the initial `status` so we stay in sync.
    };
  }

  // Refit on any container size change. `resize` alone fires dozens of
  // times per drag with often-stale layout state, so wrap it in a
  // ResizeObserver + rAF for a single fit per animation frame with
  // guaranteed post-layout dimensions. On resize-driven overflow we
  // trim from the front (drop oldest until it fits) rather than
  // clearing entirely — preserves more context than a page-break would.
  let refitRaf = null;
  function scheduleRefit() {
    if (refitRaf) return;
    refitRaf = requestAnimationFrame(() => {
      refitRaf = null;
      refit();
    });
  }
  function refit() {
    render();
    // render() already trims from the front to fit; nothing extra to do.
  }
  // Observe BOTH the documentElement (viewport-shaped) and #stage /
  // #suspended themselves. OBS's CEF has been observed to fire body
  // observations at the wrong time on initial load, and it doesn't
  // always fire a window `resize` when the Browser Source is resized
  // through the OBS scene UI — but observing the fixed-positioned
  // overlay elements (whose size == viewport) picks that up reliably.
  const ro = new ResizeObserver(scheduleRefit);
  ro.observe(document.documentElement);
  ro.observe(stage);
  ro.observe(document.getElementById("suspended"));
  window.addEventListener("resize", scheduleRefit);
  refit();
  connect();
})();
</script>
</body>
</html>
