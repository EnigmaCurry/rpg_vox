<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RPG Vox</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1e2127;
    --border: #2a2e37;
    --text: #e6e8ec;
    --muted: #8a92a3;
    --accent: #7aa2ff;
    --ok: #6bd490;
    --err: #ff8080;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 680px;
    padding: 32px 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  .health { font-size: 12px; color: var(--muted); }
  .health.ok  { color: var(--ok); }
  .health.err { color: var(--err); }
  textarea {
    width: 100%;
    min-height: 140px;
    padding: 12px 14px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font: inherit;
    resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
  }
  button {
    padding: 10px 18px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #0b0d10;
    border-radius: 8px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint { font-size: 12px; color: var(--muted); }
  #status { min-height: 1.2em; font-size: 13px; }
  #status.ok  { color: var(--ok); }
  #status.err { color: var(--err); }
  #log {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 8px;
  }
  .entry {
    padding: 8px 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    display: flex;
    gap: 10px;
    align-items: baseline;
  }
  .entry .ts { color: var(--muted); font-variant-numeric: tabular-nums; }
  .entry.err { border-color: var(--err); }

  details {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 12px;
  }
  details[open] { padding-bottom: 12px; }
  summary {
    cursor: pointer;
    padding: 10px 0;
    font-weight: 600;
    user-select: none;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before {
    content: "▸";
    display: inline-block;
    transition: transform 0.15s;
    color: var(--muted);
    margin-right: 6px;
  }
  details[open] > summary::before { transform: rotate(90deg); }
  summary .sum-meta { font-weight: 400; color: var(--muted); font-size: 12px; }
  .section-body {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .sink-list { display: flex; flex-direction: column; gap: 4px; }
  .sink-list label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  .sink-list label:hover { background: rgba(255,255,255,0.03); }
  .sink-list input[type=radio] { accent-color: var(--accent); }
  .sink-list .id { color: var(--muted); font-size: 11px; margin-left: auto; }
  .listeners {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 13px;
    color: var(--muted);
  }
  .listener { padding: 4px 8px; background: rgba(255,255,255,0.03); border-radius: 4px; }
  .empty { color: var(--muted); font-style: italic; font-size: 13px; }
  .actions { display: flex; gap: 8px; }
  .actions button { padding: 6px 12px; font-size: 13px; font-weight: 500; }
  .actions button.secondary {
    background: transparent;
    color: var(--text);
    border-color: var(--border);
  }
  .subhead {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .subhead .note { font-size: 11px; }
  input[type="text"], input[type="url"], select {
    width: 100%;
    padding: 8px 10px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    font: inherit;
    font-size: 13px;
    font-family: ui-monospace, "SF Mono", monospace;
  }
  input[type="text"]:focus, input[type="url"]:focus, select:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  input.dirty { border-color: var(--accent); }
  .field-row { display: flex; gap: 8px; align-items: center; }
  .field-row input { flex: 1; }
  hr.section-sep {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 4px 0;
  }

  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 8px 16px;
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
    margin-bottom: -1px;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    background: var(--panel);
    color: var(--text);
    border-color: var(--border);
  }
  .tab-panel { display: flex; flex-direction: column; gap: 18px; }
  .tab-panel[hidden] { display: none; }

  .chat-log {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 200px;
    max-height: 480px;
    overflow-y: auto;
    padding: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .chat-msg {
    padding: 8px 12px;
    border-radius: 8px;
    max-width: 85%;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .chat-msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: #0b0d10;
  }
  .chat-msg.assistant {
    align-self: flex-start;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
  }
  .chat-msg.assistant.pending { color: var(--muted); font-style: italic; }
  .chat-log .empty { text-align: center; padding: 20px 0; }
  #chat-input { min-height: 80px; }
  #chat-status { min-height: 1.2em; font-size: 13px; color: var(--muted); }
  #chat-status.ok  { color: var(--ok); }
  #chat-status.err { color: var(--err); }
</style>
</head>
<body>
<main>
  <header>
    <h1>RPG Vox</h1>
    <span id="health" class="health">checking…</span>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="speak" role="tab" aria-selected="true">Speak</button>
    <button class="tab" data-tab="chat" role="tab" aria-selected="false">Chat</button>
  </nav>

  <section class="tab-panel" id="tab-speak" role="tabpanel">
    <textarea id="text" placeholder="Type what the mic should say…" autofocus></textarea>

    <div class="row">
      <span class="hint">Enter to send · Shift+Enter for newline</span>
      <button id="send">Say it</button>
    </div>

    <div id="status"></div>
    <div id="log"></div>
  </section>

  <section class="tab-panel" id="tab-chat" role="tabpanel" hidden>
    <div id="chat-log" class="chat-log">
      <div class="empty">no messages yet</div>
    </div>

    <textarea id="chat-input" placeholder="Message the assistant…"></textarea>

    <div class="row">
      <span class="hint">Enter to send · Shift+Enter for newline</span>
      <div class="actions">
        <label class="hint" style="display:flex;align-items:center;gap:6px">
          <input type="checkbox" id="chat-speak" checked>
          Speak replies
        </label>
        <button id="chat-clear" class="secondary">Clear</button>
        <button id="chat-send">Send</button>
      </div>
    </div>

    <div id="chat-status"></div>
  </section>

  <details id="settings-panel">
    <summary>
      <span>Settings</span>
      <span class="sum-meta" id="settings-summary">—</span>
    </summary>
    <div class="section-body">
      <!-- Workflow controls are ComfyUI-only; hidden when the backend is
           something local like piper. Toggled from renderSettings(). -->
      <div id="wf-block" style="display:none">
        <div class="subhead">
          <span>TTS workflow</span>
          <span class="note" id="wf-source">—</span>
        </div>
        <div class="field-row">
          <select id="wf-select"><option value="">— placeholder —</option></select>
        </div>
        <div id="wf-summary" class="empty" style="margin-top:6px">no workflow info yet</div>
        <div class="actions" style="margin-top:8px">
          <button id="wf-verify" class="secondary">Verify nodes</button>
          <button id="wf-warmup" class="secondary">Warm up</button>
        </div>
      </div>

      <hr class="section-sep" id="wf-sep" style="display:none">

      <div>
        <div class="subhead"><span>Local monitor</span></div>
        <div class="sink-list" id="sink-list"><div class="empty">no sinks yet</div></div>
        <div class="actions" style="margin-top:8px">
          <button id="pw-monitor-stop" class="secondary" style="display:none">Stop monitor</button>
          <button id="pw-refresh" class="secondary">Refresh</button>
        </div>
      </div>

      <hr class="section-sep">

      <div>
        <div class="subhead"><span>Who's listening</span></div>
        <div class="listeners" id="listeners"><div class="empty">nobody</div></div>
      </div>
    </div>
  </details>
</main>

<script>
  const $text   = document.getElementById("text");
  const $send   = document.getElementById("send");
  const $status = document.getElementById("status");
  const $log    = document.getElementById("log");
  const $health = document.getElementById("health");

  function setStatus(msg, kind) {
    $status.textContent = msg;
    $status.className = kind || "";
  }

  function logEntry(text, kind) {
    const div = document.createElement("div");
    div.className = "entry" + (kind ? " " + kind : "");
    const ts = new Date().toLocaleTimeString();
    div.innerHTML = `<span class="ts">${ts}</span><span></span>`;
    div.lastChild.textContent = text;
    $log.prepend(div);
    while ($log.children.length > 20) $log.removeChild($log.lastChild);
  }

  async function checkHealth() {
    try {
      const r = await fetch("/healthz");
      if (r.ok) {
        $health.textContent = "online";
        $health.className = "health ok";
      } else {
        throw new Error(r.status);
      }
    } catch {
      $health.textContent = "offline";
      $health.className = "health err";
    }
  }

  async function say() {
    const text = $text.value.trim();
    if (!text) return;
    $send.disabled = true;
    setStatus("speaking…");
    let payload = null;
    try {
      const r = await fetch("/say", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text }),
      });
      try { payload = await r.json(); } catch { payload = null; }

      if (r.ok && payload && payload.ok) {
        const frames = payload.frames ?? 0;
        setStatus(`spoken (${frames.toLocaleString()} samples)`, "ok");
        logEntry(text);
        $text.value = "";
      } else {
        const detail = (payload && payload.error) || (await r.text().catch(() => "")) || `HTTP ${r.status}`;
        setStatus(`error: ${detail}`, "err");
        logEntry(`${text} — ${detail}`, "err");
      }
    } catch (e) {
      setStatus(`network error: ${e.message}`, "err");
      logEntry(`${text} — ${e.message}`, "err");
    } finally {
      $send.disabled = false;
      $text.focus();
    }
  }

  $send.addEventListener("click", say);
  $text.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      say();
    }
  });

  checkHealth();
  setInterval(checkHealth, 5000);

  // ---- Tabs ---------------------------------------------------------------
  const $tabs = document.querySelectorAll(".tab");
  const $panels = document.querySelectorAll(".tab-panel");
  function selectTab(name) {
    for (const t of $tabs) {
      const active = t.dataset.tab === name;
      t.classList.toggle("active", active);
      t.setAttribute("aria-selected", active ? "true" : "false");
    }
    for (const p of $panels) {
      p.hidden = p.id !== `tab-${name}`;
    }
    const focus = name === "speak" ? $text : $chatInput;
    focus.focus();
  }
  for (const t of $tabs) {
    t.addEventListener("click", () => selectTab(t.dataset.tab));
  }

  // ---- Chat ---------------------------------------------------------------
  const $chatLog    = document.getElementById("chat-log");
  const $chatInput  = document.getElementById("chat-input");
  const $chatSend   = document.getElementById("chat-send");
  const $chatClear  = document.getElementById("chat-clear");
  const $chatSpeak  = document.getElementById("chat-speak");
  const $chatStatus = document.getElementById("chat-status");

  function setChatStatus(msg, kind) {
    $chatStatus.textContent = msg || "";
    $chatStatus.className = kind || "";
  }

  function clearChatLogUI() {
    $chatLog.innerHTML = '<div class="empty">no messages yet</div>';
  }

  function appendChatMsg(role, text, opts = {}) {
    const empty = $chatLog.querySelector(".empty");
    if (empty) empty.remove();
    const div = document.createElement("div");
    div.className = `chat-msg ${role}${opts.pending ? " pending" : ""}`;
    div.textContent = text;
    $chatLog.append(div);
    $chatLog.scrollTop = $chatLog.scrollHeight;
    return div;
  }

  async function loadChatHistory() {
    try {
      const r = await fetch("/chat");
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const msgs = await r.json();
      clearChatLogUI();
      for (const m of msgs) {
        if (m.role === "user" || m.role === "assistant") {
          appendChatMsg(m.role, m.content);
        }
      }
    } catch (e) {
      setChatStatus(`history error: ${e.message}`, "err");
    }
  }

  async function sendChat() {
    const text = $chatInput.value.trim();
    if (!text) return;
    $chatSend.disabled = true;
    appendChatMsg("user", text);
    $chatInput.value = "";
    const pending = appendChatMsg("assistant", "…", { pending: true });
    setChatStatus("thinking…");
    try {
      const r = await fetch("/chat", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text, speak: $chatSpeak.checked }),
      });
      const body = await r.json().catch(() => null);
      if (r.ok && body && body.ok) {
        pending.classList.remove("pending");
        pending.textContent = body.reply || "";
        setChatStatus(body.spoken ? "reply queued to mic" : "reply received", "ok");
      } else {
        const detail = (body && body.error) || `HTTP ${r.status}`;
        pending.remove();
        setChatStatus(`error: ${detail}`, "err");
      }
    } catch (e) {
      pending.remove();
      setChatStatus(`network error: ${e.message}`, "err");
    } finally {
      $chatSend.disabled = false;
      $chatInput.focus();
    }
  }

  async function clearChat() {
    if (!confirm("Clear chat history?")) return;
    try {
      const r = await fetch("/chat", { method: "DELETE" });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      clearChatLogUI();
      setChatStatus("history cleared", "ok");
    } catch (e) {
      setChatStatus(`clear failed: ${e.message}`, "err");
    }
  }

  $chatSend.addEventListener("click", sendChat);
  $chatClear.addEventListener("click", clearChat);
  $chatInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendChat();
    }
  });

  loadChatHistory();

  // ---- Settings panel -----------------------------------------------------
  const $panel     = document.getElementById("settings-panel");
  const $summary   = document.getElementById("settings-summary");
  const $sinkList  = document.getElementById("sink-list");
  const $listeners = document.getElementById("listeners");
  const $monStop   = document.getElementById("pw-monitor-stop");
  const $refresh   = document.getElementById("pw-refresh");
  const $wfSelect  = document.getElementById("wf-select");
  const $wfSource  = document.getElementById("wf-source");
  const $wfSummary = document.getElementById("wf-summary");
  const $wfVerify  = document.getElementById("wf-verify");
  const $wfWarmup  = document.getElementById("wf-warmup");

  let currentMonitor = null;
  let currentAutoPatch = null;
  let autoPatchTarget = null; // configured RPG_VOX_AUTO_LINK node.name
  let lastGraph = null; // last snapshot from /pw/graph; kept so refreshSettings
                        // doesn't wipe listener/monitor info out of the summary
  let serverSettings = null; // last known server-side settings
  let availableWorkflows = []; // populated from /workflows once
  let monitorRestored = false; // guards against re-firing the saved pref after
                               // the user has explicitly interacted this session

  // Persist the monitor selection by node.name (stable across pipewire
  // sessions) rather than by numeric id (regenerated each boot).
  const MONITOR_PREF_KEY = "rpg_vox.monitor_sink_name";
  function savedMonitorName() {
    try { return localStorage.getItem(MONITOR_PREF_KEY); } catch { return null; }
  }
  function setSavedMonitorName(name) {
    try {
      if (name) localStorage.setItem(MONITOR_PREF_KEY, name);
      else      localStorage.removeItem(MONITOR_PREF_KEY);
    } catch {}
  }

  async function refreshGraph() {
    try {
      const r = await fetch("/pw/graph");
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const g = await r.json();
      renderGraph(g);
    } catch (e) {
      setStatus(`graph error: ${e.message}`, "err");
    }
  }

  function renderGraph(g) {
    lastGraph = g;
    currentMonitor = g.monitor_sink_id ?? null;
    currentAutoPatch = g.auto_patch_sink_id ?? null;
    autoPatchTarget = g.auto_patch_target ?? null;
    updateSummary();

    $monStop.style.display = currentMonitor !== null ? "" : "none";

    // Hide the auto-patch target from the monitor picker — both while it's
    // actively patched (by id) and during the brief reconnect window after
    // the peer restarted but before we've re-patched (by name).
    const monitorable = g.sinks.filter(
      (s) => s.id !== currentAutoPatch && s.name !== autoPatchTarget,
    );
    if (!monitorable.length) {
      $sinkList.innerHTML = '<div class="empty">no sinks available</div>';
    } else {
      $sinkList.innerHTML = "";
      for (const s of monitorable) {
        const id = `sink-${s.id}`;
        const label = document.createElement("label");
        label.htmlFor = id;
        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "monitor-sink";
        radio.id = id;
        radio.value = s.id;
        radio.checked = currentMonitor === s.id;
        radio.addEventListener("change", () => startMonitor(s.id));
        const desc = document.createElement("span");
        desc.textContent = s.description || s.name;
        const idSpan = document.createElement("span");
        idSpan.className = "id";
        idSpan.textContent = `#${s.id}`;
        label.append(radio, desc, idSpan);
        $sinkList.append(label);
      }
    }

    if (!g.listeners.length) {
      $listeners.innerHTML = '<div class="empty">nobody</div>';
    } else {
      $listeners.innerHTML = "";
      for (const l of g.listeners) {
        const div = document.createElement("div");
        div.className = "listener";
        div.textContent = `${l.description || l.name}  ·  #${l.id}`;
        $listeners.append(div);
      }
    }

    // First-graph-after-load: if there's a saved monitor preference and
    // nothing is monitoring yet, re-apply it. Only fires once per page load
    // so a later Stop click won't get overridden on the next refresh.
    if (!monitorRestored && currentMonitor === null) {
      const wanted = savedMonitorName();
      if (wanted) {
        const match = monitorable.find((s) => s.name === wanted);
        if (match) {
          monitorRestored = true;
          startMonitor(match.id, { restore: true });
        }
      }
    }
  }

  async function startMonitor(sinkId, opts = {}) {
    // Any explicit change is a user intent — mark restore as done so the
    // saved-pref restore loop above doesn't fight the click.
    monitorRestored = true;
    try {
      const r = await fetch("/pw/monitor", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ sink_id: sinkId }),
      });
      const body = await r.json().catch(() => null);
      if (!r.ok || (body && !body.ok)) {
        const err = (body && body.error) || `HTTP ${r.status}`;
        setStatus(`monitor error: ${err}`, "err");
      } else {
        // Persist by sink.name (id is ephemeral). Fall back to whatever
        // lastGraph has cached; skip persistence if we can't resolve one.
        const sink = (lastGraph && lastGraph.sinks || []).find((s) => s.id === sinkId);
        if (sink && sink.name) setSavedMonitorName(sink.name);
        setStatus(opts.restore ? `restored monitor: sink #${sinkId}` : `monitoring sink #${sinkId}`, "ok");
      }
    } catch (e) {
      setStatus(`monitor error: ${e.message}`, "err");
    } finally {
      refreshGraph();
    }
  }

  async function stopMonitor() {
    monitorRestored = true; // user intent — don't auto-re-apply on next graph
    try {
      const r = await fetch("/pw/monitor", { method: "DELETE" });
      const body = await r.json().catch(() => null);
      if (!r.ok || (body && !body.ok)) {
        setStatus(`stop error: ${(body && body.error) || r.status}`, "err");
      } else {
        setSavedMonitorName(null);
        setStatus("monitor stopped", "ok");
      }
    } catch (e) {
      setStatus(`stop error: ${e.message}`, "err");
    } finally {
      refreshGraph();
    }
  }

  $monStop.addEventListener("click", stopMonitor);
  $refresh.addEventListener("click", () => { refreshSettings(); refreshGraph(); });

  // ---- Settings panel -----------------------------------------------------
  function updateSummary() {
    const backend = (serverSettings && serverSettings.backend) || "?";
    const isComfy = backend === "comfyui";
    const head = isComfy
      ? `workflow: ${serverSettings && serverSettings.workflow_name ? serverSettings.workflow_name : "placeholder"}`
      : `backend: ${backend}`;
    const g = lastGraph;
    const patchPart = g && currentAutoPatch !== null ? ` · auto→#${currentAutoPatch}` : "";
    const monPart = g && currentMonitor !== null ? ` · monitor→#${currentMonitor}` : "";
    const gPart = g ? ` · ${g.listeners.length} listener(s)${patchPart}${monPart}` : "";
    $summary.textContent = `${head}${gPart}`;
  }

  // Workflow selector + verify/warmup buttons are ComfyUI-specific; hide the
  // whole block (and its separator) when the server is running a local backend.
  function applyBackendVisibility() {
    const isComfy = serverSettings && serverSettings.backend === "comfyui";
    const disp = isComfy ? "" : "none";
    const $wfBlock = document.getElementById("wf-block");
    const $wfSep   = document.getElementById("wf-sep");
    if ($wfBlock) $wfBlock.style.display = disp;
    if ($wfSep)   $wfSep.style.display   = disp;
  }

  async function refreshSettings() {
    try {
      const r = await fetch("/settings");
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      serverSettings = await r.json();
      $wfSelect.value = serverSettings.workflow_name || "";
      renderWorkflowSummary();
      applyBackendVisibility();
      updateSummary();
    } catch (e) {
      setStatus(`settings error: ${e.message}`, "err");
    }
  }

  async function refreshWorkflows() {
    try {
      const r = await fetch("/workflows");
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      availableWorkflows = await r.json();
      const selected = serverSettings ? (serverSettings.workflow_name || "") : "";
      $wfSelect.innerHTML = "";
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = availableWorkflows.length
        ? "— placeholder —"
        : "— placeholder (no workflows in dir) —";
      $wfSelect.append(placeholder);
      for (const w of availableWorkflows) {
        const opt = document.createElement("option");
        opt.value = w.name;
        opt.textContent = `${w.name}  (${w.summary.node_count} nodes)`;
        $wfSelect.append(opt);
      }
      $wfSelect.value = selected;
    } catch (e) {
      setStatus(`workflow list error: ${e.message}`, "err");
    }
  }

  async function postSettings(patch, okMsg) {
    try {
      const r = await fetch("/settings", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(patch),
      });
      const body = await r.json().catch(() => null);
      if (!r.ok || (body && body.ok === false)) {
        const detail = (body && body.error) || `HTTP ${r.status}`;
        setStatus(`settings error: ${detail}`, "err");
        return false;
      }
      serverSettings = body;
      $wfSelect.value = serverSettings.workflow_name || "";
      renderWorkflowSummary();
      applyBackendVisibility();
      setStatus(okMsg, "ok");
      return true;
    } catch (e) {
      setStatus(`save failed: ${e.message}`, "err");
      return false;
    } finally {
      updateSummary();
    }
  }

  function renderWorkflowSummary() {
    const w = serverSettings && serverSettings.workflow_summary;
    if (!w) { $wfSummary.textContent = "no workflow info yet"; return; }
    const classes = w.node_classes && w.node_classes.length
      ? w.node_classes.join(", ") : "none";
    const warn = w.has_text_placeholder ? "" : "  ⚠ no {{TEXT}} placeholder";
    $wfSummary.textContent =
      `${w.node_count} nodes · classes: ${classes}${warn}`;
    $wfSummary.classList.toggle("empty", false);
    $wfSource.textContent = w.source || "—";
  }

  async function chooseWorkflow() {
    const name = $wfSelect.value;
    $wfSelect.disabled = true;
    await postSettings({ workflow_name: name }, name ? `workflow: ${name}` : "workflow: placeholder");
    $wfSelect.disabled = false;
  }

  async function verifyWorkflow() {
    $wfVerify.disabled = true;
    setStatus("verifying nodes on ComfyUI…");
    try {
      const r = await fetch("/workflow/verify", { method: "POST" });
      const body = await r.json();
      if (body.error) {
        setStatus(`verify: ${body.error}`, "err");
      } else if (body.missing && body.missing.length) {
        setStatus(`missing on server: ${body.missing.join(", ")}`, "err");
      } else {
        setStatus("all workflow nodes present", "ok");
      }
    } catch (e) {
      setStatus(`verify failed: ${e.message}`, "err");
    } finally {
      $wfVerify.disabled = false;
    }
  }

  async function warmupWorkflow() {
    $wfWarmup.disabled = true;
    setStatus("warming up model…");
    try {
      const r = await fetch("/workflow/warmup", { method: "POST" });
      const body = await r.json();
      if (r.ok && body.ok) setStatus("warmup complete", "ok");
      else setStatus(`warmup failed: ${body.error || r.status}`, "err");
    } catch (e) {
      setStatus(`warmup failed: ${e.message}`, "err");
    } finally {
      $wfWarmup.disabled = false;
    }
  }

  $wfSelect.addEventListener("change", chooseWorkflow);
  $wfVerify.addEventListener("click", verifyWorkflow);
  $wfWarmup.addEventListener("click", warmupWorkflow);

  // Poll only while the expander is open.
  function tick() { if ($panel.open) { refreshGraph(); refreshSettings(); } }
  $panel.addEventListener("toggle", () => {
    if ($panel.open) { refreshGraph(); refreshSettings(); }
  });
  setInterval(tick, 3000);

  // Initial fetch of settings + workflow list so the summary is populated
  // even when the panel is closed. The order matters: fetch workflows before
  // settings so the <select> already has the option we want to select.
  // refreshGraph runs unconditionally too so the saved-monitor restore fires
  // even if the user never opens the Settings expander.
  (async () => {
    await refreshWorkflows();
    await refreshSettings();
    await refreshGraph();
  })();
</script>
</body>
</html>
