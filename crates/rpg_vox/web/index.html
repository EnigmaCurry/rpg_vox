         spaces so it doesn't appear in the browser tab. Firefox propagates
         document.title to the pipewire node's media.name for streams this
         page creates (Web Audio, MediaStream), and the server matches on
         this marker substring to exclude our own monitor from the Mixer's
         Sources list — otherwise routing it would cause instant feedback.
         Keep the literal `rpg-vox-browser-monitor` in sync with
         BROWSER_MONITOR_STREAM_TITLE in crates/rpg_vox/src/pw_source.rs. -->
