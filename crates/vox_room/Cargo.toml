[package]
name = "vox_room"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A voice room in the browser: people talk through their headsets, hear each other and an AI that talks back, and share one live transcript"
build = "build.rs"

[[bin]]
name = "vox_room"
path = "src/main.rs"

[features]
default = ["translate-local"]
# Marian translation on the CPU, for `--translate local`. It brings a
# CMake build of CTranslate2 with it, linked statically, so the only
# cost is build time -- and none of it is paid at runtime unless
# `--translate local` is actually asked for.
translate-local = ["vox_transcribe/ct2"]

[dependencies]
vox_transcribe = { path = "../vox_transcribe", features = ["llm", "sherpa-static"] }
tokio.workspace = true
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
# The Svelte SPA (web/), built by build.rs into dist-ui/.
rust-embed = { version = "8", features = ["mime-guess"] }
# Mic frames in, each listener's mix out: 20 ms Opus frames. And a
# recording of the room, which is the same encoder pointed at a file.
opus = "0.3"
# The container a recording of the room goes in. Opus has to be in one
# to be a file a browser will play, and this writes the pages. See
# `recorder.rs`.
ogg = "0.9"
# Pinned to share libsqlite3-sys with the rest of the workspace.
rusqlite = { version = "0.31", features = ["bundled"] }
# Blocking HTTP for the LLM stream and the TTS server, on their own threads.
ureq = { version = "2", features = ["json"] }
# What an MCP server hands back a picture in, when it hands one back
# inline rather than as a URL to fetch. See mcp.rs.
base64 = "0.22"
# The one inline script in index.html is let through the page's own
# Content-Security-Policy by the hash of its bytes, worked out at
# startup from whatever is actually embedded. See `policy()` in web.rs.
sha2 = "0.10"
hound = "3"
rubato = "0.15"
crossbeam-channel = "0.5"
uuid = { version = "1", features = ["v4"] }
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
