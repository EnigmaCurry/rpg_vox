[package]
name = "vox_audio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mono f32 audio capture and playback: PipeWire on Linux, CoreAudio on macOS (devices or one app), plus file decode and Ogg Opus recordings"

[dependencies]
anyhow.workspace = true
tracing.workspace = true
serde_json.workspace = true
crossbeam-channel = "0.5"
rtrb.workspace = true
symphonia = { version = "0.5", features = ["wav", "mp3", "flac", "ogg", "vorbis", "pcm"] }
# Ogg Opus recordings (write while transcribing, read back for playback).
opus = "0.3"
ogg = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire.workspace = true
libspa.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
cpal = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18"
libc = "0.2"
objc2 = "0.6"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSObject", "NSString", "NSUUID", "NSValue"] }
