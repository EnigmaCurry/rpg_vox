[package]
name = "vox_transcribe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Layered live speech-to-text: streaming partials, offline finals, boundary re-transcription"

[features]
default = ["sherpa"]
# sherpa-onnx recognizers (Zipformer streaming + SenseVoice offline).
# `shared` matches rpg_vox so a workspace build never unifies `static`
# (which statically links espeak-ng and clashes with piper-rs).
sherpa = ["dep:sherpa-onnx"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }
crossbeam-channel = "0.5"
libc = "0.2"
sherpa-onnx = { version = "1.13.7", default-features = false, features = ["shared"], optional = true }
