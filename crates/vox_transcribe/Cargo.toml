[package]
name = "vox_transcribe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Layered live speech-to-text: streaming partials, offline finals, boundary re-transcription"

[features]
default = []
# sherpa-onnx recognizers (Zipformer streaming + SenseVoice offline).
# Pick exactly one link mode; sherpa-onnx-sys errors if both end up on
# in one build. The workspace uses `static` everywhere (rpg_vox too).
sherpa = ["dep:sherpa-onnx", "dep:sherpa-onnx-sys"]
sherpa-shared = ["sherpa", "sherpa-onnx/shared"]
sherpa-static = ["sherpa", "sherpa-onnx/static"]
# OpenAI-compatible chat client for the pass-4 corrector.
llm = ["dep:ureq", "dep:serde_json"]
# Marian translation on the CPU through CTranslate2, for a room that
# translates without a network. `ruy` is its own CPU backend;
# `tokenizers` is the pure-Rust one, which is what keeps this buildable
# at all -- see `ct2::TOKENIZER` for why a SentencePiece tokenizer
# cannot be in the same binary as sherpa-onnx. CTranslate2 itself is
# built by cmake and linked statically, so nothing has to be installed
# alongside the binary, the same arrangement sherpa-onnx already uses.
ct2 = ["dep:ct2rs", "dep:tokenizers"]
# Experimental DeepFilterNet 3 noise filter (EngineConfig::denoise).
deepfilter = ["dep:deep_filter", "dep:ndarray"]
# Telling languages apart *within* one alphabet, off the text a decode
# came back as -- English against French, Russian against Ukrainian,
# which `language::script` cannot do and must not pretend to. The
# `Classify` trait is always compiled; only the backends are optional,
# so `language::of`'s signature does not move with the feature list.
#
# Two backends because which to ship is a measurement and not a
# preference -- `examples/langid_bench.rs` is what settles it. They are
# not interchangeable in shape, though: fastText is one 917 KB file
# covering 176 languages, chosen at runtime, where lingua's languages
# are *cargo features* and cost ~5 MB of n-gram FSTs each in the
# binary. An app whose languages are a settings page wants the former
# almost regardless of the accuracy; lingua is here to say what that
# choice costs.
langid-fasttext = ["dep:fasttext-pure-rs"]
langid-lingua = ["dep:lingua"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }
crossbeam-channel = "0.5"
libc = "0.2"
ureq = { version = "2", features = ["json"], optional = true }
serde_json = { workspace = true, optional = true }
sherpa-onnx = { version = "1.13.7", default-features = false, optional = true }
# Raw bindings, for the diarization progress callback the safe API lacks.
# Its link mode comes from sherpa-onnx's static/shared feature.
sherpa-onnx-sys = { version = "1.13.7", default-features = false, optional = true }
# Not on crates.io with the tract backend; the model is built in.
ct2rs = { version = "0.10", default-features = false, features = ["ruy", "tokenizers"], optional = true }
# The tokenizer ct2rs reads the model with, which `spm` also writes: the
# same version ct2rs asks for, so there is one copy of it in the binary.
tokenizers = { version = "0.22", optional = true }
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", tag = "v0.5.6", default-features = false, features = ["tract", "default-model"], optional = true }
ndarray = { version = "0.15", optional = true }
# fastText inference with no C++ in it, which is the whole reason for
# this one rather than the `fasttext` bindings: Facebook's library does
# not cross-compile to the NDK without a fork, and a second C++ library
# in this binary is how the SentencePiece/protobuf collision started
# (see `ct2::TOKENIZER`). Reads the quantized `lid.176.ftz` as shipped.
fasttext-pure-rs = { version = "0.1", optional = true }
# The accuracy reference for the bench. Its languages are features:
# this list is what the bench can compare on, not what anything ships.
lingua = { version = "1.8", default-features = false, optional = true, features = [
    "english",
    "russian",
    "ukrainian",
    "french",
    "spanish",
    "german",
    "portuguese",
    "italian",
    "bulgarian",
] }
