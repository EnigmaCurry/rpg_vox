[package]
name = "discord_vox"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Discord voice bridge — routes a PipeWire sink into a Discord voice channel"

[dependencies]
# Discord gateway + voice.
serenity = { version = "0.12", default-features = false, features = [
    "client",
    "gateway",
    "model",
    "voice",
    "cache",
    "rustls_backend",
] }
songbird = { version = "0.6", default-features = false, features = [
    "serenity",
    "driver",
    "rustls",
    "gateway",
    "tungstenite",
    "receive",
] }

# WAV file writer for the mixed track (transcoded to FLAC at session end).
hound = "3"
# Ogg container for raw-Opus per-user capture.
ogg = "0.9"
# Provides the `Packet` trait so we can call `.payload()` on the RTP packet
# songbird hands us via VoiceTick. Version matches songbird 0.6's own dep.
discortp = "0.6"

# Metadata store: SQLite via rusqlite (bundled so it doesn't depend on a
# system libsqlite). Small writes only; no server, queryable with `sqlite3`.
rusqlite = { version = "0.31", features = ["bundled"] }
# Timestamped session directory names.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# MediaSource trait for the raw PCM adapter that feeds songbird.
symphonia-core = "0.5"
# Enables the PCM decoder in symphonia's default registry. Songbird's RawReader
# tags the raw stream as CODEC_TYPE_PCM_F32LE, but songbird declares symphonia
# with no default features, so without this the codec has no decoder and the
# track fails with `no compatible track found`.
symphonia = { version = "0.5", default-features = false, features = ["pcm"] }

# PipeWire sink node (in-process).
pipewire.workspace = true
libspa.workspace = true

# Realtime SPSC ring buffer — used later to hand samples from the sink's
# realtime process callback to the songbird Input on the tokio side.
rtrb.workspace = true

tokio.workspace = true
clap = { workspace = true, features = ["env"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# HTTP client for firing POST /record/hint at rpg_vox on Discord speaking
# events. rustls-tls avoids a system OpenSSL dep; `json` pulls in the
# lightweight serde_json path used to serialize hint bodies. Same
# feature set as rpg_vox uses to keep the shared build cache warm.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = { workspace = true }
