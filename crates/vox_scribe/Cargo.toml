[package]
name = "vox_scribe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Live layered transcription in the terminal, saved as markdown"

# Short to type; the crate keeps its workspace name.
[[bin]]
name = "scribe"
path = "src/main.rs"

[features]
default = ["denoise"]
# --denoise (DeepFilterNet 3, built in).
denoise = ["vox_transcribe/deepfilter"]

[dependencies]
vox_transcribe = { path = "../vox_transcribe", features = ["llm", "sherpa-static"] }
vox_audio = { path = "../vox_audio" }
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
tracing.workspace = true
tracing-subscriber.workspace = true
crossbeam-channel = "0.5"
vox_chat = { path = "../vox_chat" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ratatui = "0.30"
unicode-width = "0.2"
ctrlc = "3"
serde_json.workspace = true
# `scribe download-models` unpacks the sherpa-onnx .tar.bz2 bundles
# itself, so no `tar` has to be installed.
tar = "0.4"
bzip2 = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
libc = "0.2"
# The clipboard, which `clip.exe` can't hold anything but ASCII in.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }
