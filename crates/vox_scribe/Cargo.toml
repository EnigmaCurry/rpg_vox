[package]
name = "vox_scribe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Live layered transcription in the terminal, saved as markdown"

# Short to type; the crate keeps its workspace name.
[[bin]]
name = "scribe"
path = "src/main.rs"

[dependencies]
vox_transcribe = { path = "../vox_transcribe", features = ["llm", "sherpa-static"] }
vox_audio = { path = "../vox_audio" }
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
tracing.workspace = true
tracing-subscriber.workspace = true
crossbeam-channel = "0.5"
# --chat: the database scribe and a responder share. Same version and
# bundled sqlite as rpg_vox and discord_vox (one libsqlite3-sys per build).
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ratatui = "0.30"
unicode-width = "0.2"
ctrlc = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"
